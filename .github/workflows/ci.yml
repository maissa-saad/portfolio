name: CI

on:
  push:

permissions: 
  contents: read
  packages: write

jobs: 
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm ci

      - name: run lint
        run: npm run lint
      
      - name: build
        run: npm run build

      - name: créer une image docker
        run: docker build -t portfolio .
